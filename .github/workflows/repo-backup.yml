name: Repo Backup to S3

# ---------------------------------------------------------------------------
# THE SHARED COPY OF THE WEEKLY-BACKUP JOB.
#
# Callers own the schedule. This file is `workflow_call`-only so a new
# consumer is a short caller workflow plus that repository's `main` subject
# on the backup role trust policy. Do not `uses:` Specter099/.github — this
# is the estate copy.
#
# HOW TO CALL IT — and yes, the path really does say `.github` twice:
#
#     jobs:
#       backup:
#         permissions:
#           id-token: write
#           contents: read
#         uses: lauerbr/.github/.github/workflows/repo-backup.yml@main
#         with:
#           s3-bucket: ${{ vars.BACKUP_S3_BUCKET }}
#
# The first `.github` is the REPOSITORY name; the second is the `.github/`
# directory inside it. Restricted default workflow permissions mean the
# caller job must grant `id-token: write` or the reusable job fails at
# startup.
#
# ROLE ARN COMES FROM THE CALLER. `vars` in a reusable workflow resolve
# against the caller repository, not this one:
#
#     https://docs.github.com/en/actions/reference/workflows-and-actions/variables
#
# The job reads `vars.AWS_BACKUP_ROLE_ARN` and fails clearly if it is
# missing. This repository does not assume AWS roles and does not hold the
# backup bucket. OIDC and the bucket live in the caller; the first caller
# is `ground-orbit-website` bootstrap.
#
# NO `environment:` KEY. The backup role is pinned to
# `repo:<owner>/<repo>:ref:refs/heads/main`. Naming an environment would
# change the OIDC `sub` to `environment:...`, which is a different claim
# and will not match that trust policy.
#
# Adding a new caller is that three-line `uses:` plus listing the new
# repository's `main` subject on the backup role trust policy
# (`StringEquals`, no wildcards).
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      s3-bucket:
        description: S3 bucket name to upload the backup to
        type: string
        required: true
      s3-prefix:
        description: Key prefix (folder) within the bucket (defaults to repo name)
        type: string
        default: ""
      aws-region:
        description: AWS region of the S3 bucket
        type: string
        default: "us-east-1"

jobs:
  backup:
    name: Backup to S3
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Snapshot of HEAD only (git archive), so a shallow checkout is enough.
    # cancel-in-progress: false — never abort a mid-upload backup.
    concurrency:
      group: repo-backup-${{ github.repository }}
      cancel-in-progress: false
    # No `environment:` here. The backup role's trust policy is pinned to
    # `ref:refs/heads/main`. Naming an environment would change the OIDC
    # subject to `environment:...`.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve inputs
        id: vars
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PREFIX: ${{ inputs.s3-prefix }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$PREFIX" ]; then
            PREFIX="$REPO_NAME"
          fi
          DATE=$(date -u +%Y-%m-%d)
          FILENAME="${REPO_NAME}-${DATE}-${SHA:0:7}.zip"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "s3-key=${PREFIX}/${FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        env:
          FILENAME: ${{ steps.vars.outputs.filename }}
        run: |
          git archive --format=zip --output="$FILENAME" HEAD
          SIZE=$(stat -c %s "$FILENAME")
          echo "ARCHIVE_SIZE=$SIZE" >> "$GITHUB_ENV"

      - name: Verify backup role ARN
        env:
          ROLE_ARN: ${{ vars.AWS_BACKUP_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_BACKUP_ROLE_ARN is not set on the calling repository. Reusable workflows read vars from the caller, not from lauerbr/.github. Set that repository variable after the caller's main subject is listed on the backup role trust policy." >&2
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6.2.2
        with:
          # `vars` resolves against the CALLER's repository, not this one:
          # "For reusable workflows, the variables from the caller
          # workflow's repository are used."
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Upload to S3
        env:
          FILENAME: ${{ steps.vars.outputs.filename }}
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_KEY: ${{ steps.vars.outputs.s3-key }}
        run: |
          aws s3 cp "$FILENAME" "s3://${S3_BUCKET}/${S3_KEY}"

      - name: Write job summary
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FILENAME: ${{ steps.vars.outputs.filename }}
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_KEY: ${{ steps.vars.outputs.s3-key }}
        run: |
          {
            echo "## Repo Backup"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Repository | \`${REPOSITORY}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Archive | \`${FILENAME}\` |"
            echo "| Size | $ARCHIVE_SIZE |"
            echo "| S3 URI | \`s3://${S3_BUCKET}/${S3_KEY}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
